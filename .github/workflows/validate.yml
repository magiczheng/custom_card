name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Card & HACS structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax
        run: node --check battery-monitor-card.js

      - name: HACS repository structure
        run: |
          node - <<'EOF'
          const fs = require("fs");

          const manifest = JSON.parse(fs.readFileSync("hacs.json", "utf8"));
          if (!manifest.name) throw new Error("hacs.json: missing name");
          if (!manifest.filename) {
            throw new Error("hacs.json: missing filename (required for this repository)");
          }
          if (!fs.existsSync(manifest.filename)) {
            throw new Error(`hacs.json filename '${manifest.filename}' does not exist`);
          }

          const source = fs.readFileSync(manifest.filename, "utf8");
          if (!/customElements\.define\(/.test(source)) {
            throw new Error("Card file does not define a custom element");
          }
          if (!/window\.customCards\s*=/.test(source)) {
            throw new Error("Card file does not register itself in window.customCards");
          }
          if (!fs.existsSync("README.md")) throw new Error("README.md is missing");
          if (!fs.existsSync("LICENSE")) throw new Error("LICENSE is missing");

          console.log("OK: HACS structure is valid for a Dashboard/plugin repository");
          EOF
